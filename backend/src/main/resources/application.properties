server.port=8080

# PostgreSQL (valores por defecto = los de docker-compose.yml).
# En Docker y en la nube se sobreescriben con las variables SPRING_DATASOURCE_*.
spring.datasource.url=jdbc:postgresql://localhost:5432/pixelvault_db
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# data.sql se ejecuta despues de que Hibernate cree las tablas.
# OJO: borra compras y catalogo en cada arranque; con datos reales usar SQL_INIT_MODE=never.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8

# JWT: fuera de desarrollo, definir PIXELVAULT_JWT_SECRET (minimo 32 caracteres).
pixelvault.jwt.secret=${PIXELVAULT_JWT_SECRET:pixelvault-secret-key-cambiar-en-produccion-2026}
pixelvault.jwt.expiration-ms=7200000
