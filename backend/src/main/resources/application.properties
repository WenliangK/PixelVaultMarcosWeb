server.port=8080

# PostgreSQL (valores por defecto = los de docker-compose.yml).
# En Docker se sobreescriben con las variables SPRING_DATASOURCE_*.
spring.datasource.url=jdbc:postgresql://localhost:5432/pixelvault_db
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# data.sql se ejecuta despues de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

pixelvault.jwt.secret=pixelvault-secret-key-cambiar-en-produccion-2026
pixelvault.jwt.expiration-ms=7200000
spring.sql.init.encoding=UTF-8
